<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Student Portal</title>
  <link rel="stylesheet" href="registration_style.css">
</head>
<body>
  <header>
    <img src="culogo.jpg" alt="CU Logo">
    <h1>Chandigarh University - UIC Campus</h1>
    <a href="login.html" class="back-btn">Back</a>
  </header>

  <div class="form-container">
    <div class="form-header">
      <h2>🎓 Student Registration Form</h2>
      <p>Please fill in your details carefully</p>
    </div>

    <form>
      <!-- Personal Details -->
      <div class="form-section">
        <h3>Personal Details</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" required placeholder="Enter Your Full Name">
          </div>
          <div class="form-group">
            <label>User ID</label>
            <input type="text" required placeholder="Enter UID">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Course</label>
            <input type="text" placeholder="Enter Course">
          </div>
          <div class="form-group">
            <label>Section</label>
            <input type="text" required placeholder="Enter Section">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" required>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select required>
              <option value="" disabled selected>Choose...</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" required placeholder="Enter Email">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" required placeholder="+91 XXXXXXXXXX">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Father's Name</label>
            <input type="text" required placeholder="Enter Father's Name">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" required placeholder="+91 XXXXXXXXXX">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Mother's Name</label>
            <input type="text" required placeholder="Enter Father's Name">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" required placeholder="+91 XXXXXXXXXX">
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>
          <textarea rows="2" required placeholder="Enter Complete Address"></textarea>
        </div>

        <div class="form-group">
          <label>Upload Photo</label>
          <input type="file" accept="image/*" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" required placeholder="Make A Strong Password">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" required placeholder="Re-enter Password">
          </div>
        </div>
      </div>

      <!-- 10th Education -->
      <div class="form-section">
        <h3>10<sup>th</sup> Education</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Board Name</label>
            <input type="text" required placeholder="Examination Board">
          </div>
          <div class="form-group">
            <label>School Name</label>
            <input type="text" required placeholder="School Name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Subjects</label>
            <input type="text" required placeholder="Subjects">
          </div>
          <div class="form-group">
            <label>Passing Year</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>2020</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Marks Obtained</label>
            <input type="text" placeholder="Marks">
          </div>
          <div class="form-group">
            <label>Total Marks</label>
            <input type="text" required placeholder="Total Marks">
          </div>
        </div>
      </div>

      <!-- 12th Education -->
      <div class="form-section">
        <h3>12<sup>th</sup> Education</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Board Name</label>
            <input type="text" required placeholder="Examination Board">
          </div>
          <div class="form-group">
            <label>School/College Name</label>
            <input type="text" required placeholder="School/College">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Stream</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>Science</option>
              <option>Commerce</option>
              <option>Arts</option>
              <option>Others</option>
            </select>
          </div>
          <div class="form-group">
            <label>Passing Year</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>2020</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Marks Obtained</label>
            <input type="text" placeholder="Marks">
          </div>
          <div class="form-group">
            <label>Total Marks</label>
            <input type="text" required placeholder="Total Marks">
          </div>
        </div>
      </div>

      <!-- Graduation -->
      <div class="form-section">
        <h3>Graduation Details</h3>
        <div class="form-row">
          <div class="form-group">
            <label>University Name</label>
            <input type="text" required placeholder="University Name">
          </div>
          <div class="form-group">
            <label>College Name</label>
            <input type="text" required placeholder="College Name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Department</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>BCA</option>
              <option>BBA</option>
              <option>B.E.</option>
              <option>B.Tech</option>
              <option>B.Com</option>
              <option>B.Sc</option>
              <option>B.Pharma</option>
              <option>Others</option>
            </select>
          </div>
          <div class="form-group">
            <label>Passing Year</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Marks Obtained</label>
            <input type="text" placeholder="Marks">
          </div>
          <div class="form-group">
            <label>Total Marks</label>
            <input type="text" required placeholder="Total Marks">
          </div>
        </div>
      </div>

      <!-- Post-Graduation -->
      <div class="form-section">
        <h3>Post-Graduation Details</h3>
        <div class="form-row">
          <div class="form-group">
            <label>University Name</label>
            <input type="text" required placeholder="University Name">
          </div>
          <div class="form-group">
            <label>College Name</label>
            <input type="text" required placeholder="College Name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Department</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>MCA</option>
              <option>MBA</option>
              <option>M.E.</option>
              <option>M.Tech</option>
              <option>M.Com</option>
              <option>M.Sc</option>
              <option>M.Pharma</option>
              <option>Others</option>
            </select>
          </div>
          <div class="form-group">
            <label>Passing Year</label>
            <select required>
              <option disabled selected>Choose...</option>
              <option>2021</option>
              <option>2022</option>
              <option>2023</option>
              <option>2024</option>
              <option>2025</option>
              <option>2026</option>
              <option>2027</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Marks Obtained</label>
            <input type="text" placeholder="Marks">
          </div>
          <div class="form-group">
            <label>Total Marks</label>
            <input type="text" required placeholder="Total Marks">
          </div>
        </div>
      </div>

      <!-- Terms -->
      <div class="form-check">
        <input type="checkbox" required>
        <label>I agree to the <a href="#">terms and conditions</a></label>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="submit" class="btn">Register</button>
        <button type="reset" class="btn secondary">Reset</button>
        <button type="reset" class="btn">Clear</button>
      </div>

      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
</body>
</html>
