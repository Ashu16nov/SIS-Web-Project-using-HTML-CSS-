<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Login</title>
  <link href="login.css" rel="stylesheet">
</head>
<body>

  <header>
    <img src="culogo.jpg" alt="CU Logo">
    <h1>Chandigarh University - UIC Campus</h1>
    <a href="index.html" class="back-btn">Home</a>
  </header>
  
  <div class="login-box">
    <h2>Student Login</h2>
    <form>
      <div class="form-group">
        <label for="uid">User ID</label>
        <input type="text" id="uid" placeholder="Enter UID" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>
      
      <button type="submit" class="btn">Login</button>
      <button type="reset" class="btn">Reset Password</button>
      <div class="register-link">
        <a href="register.html">New user? Register Now</a>
      </div>
    </form>
  </div>

</body>
</html>
